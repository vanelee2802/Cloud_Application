name: Deploy

on:
  push:
    branches: [main]   # automatisch bei jedem Push auf main
  workflow_dispatch:   # zusätzlich weiterhin per Knopfdruck

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prüfen, ob die Server-Daten hinterlegt sind
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for v in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v fehlt. Unter Settings > Secrets and variables > Actions eintragen."
              exit 1
            fi
          done

      - name: Per SSH auf dem Server deployen
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            export COMPOSER_ALLOW_SUPERUSER=1
            cd ${{ secrets.DEPLOY_PATH }}

            php artisan down || true
            # App immer wieder hochfahren – auch wenn ein Schritt fehlschlägt
            trap 'php artisan up' EXIT

            git fetch origin main
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build

            php artisan migrate --force
            php artisan db:seed --class=DefaultPatternSeeder --force
            php artisan db:seed --class=ServerGrunddatenSeeder --force
            php artisan optimize
            php artisan queue:restart

            chown -R www-data:www-data storage bootstrap/cache database
            chmod -R 775 storage bootstrap/cache database

            # NEU: Prüfen, ob ein Queue-Worker läuft (Ergebnis steht im Actions-Log)
            echo "=========== QUEUE-WORKER-CHECK ==========="
            pgrep -af "queue:work" || echo "ACHTUNG: Es läuft KEIN Queue-Worker – Mails werden nicht verschickt!"
            echo "Wartende Aufträge in der Queue: $(php artisan tinker --execute='echo DB::table(\"jobs\")->count();' 2>/dev/null || echo unbekannt)"
            echo "=========================================="