name: Deploy

on:
  workflow_dispatch:   # nur manuell per Knopfdruck, bis der Server steht

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prüfen, ob die Server-Daten hinterlegt sind
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for v in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v fehlt. Unter Settings > Secrets and variables > Actions eintragen."
              exit 1
            fi
          done

      - name: Per SSH auf dem Server deployen
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan queue:restart