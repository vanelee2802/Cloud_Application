name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prüfen, ob die Server-Daten hinterlegt sind
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for v in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v fehlt. Unter Settings > Secrets and variables > Actions eintragen."
              exit 1
            fi
          done

      - name: Per SSH auf dem Server deployen
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            export COMPOSER_ALLOW_SUPERUSER=1
            cd ${{ secrets.DEPLOY_PATH }}

            php artisan down || true
            # App immer wieder hochfahren – auch wenn ein Schritt fehlschlägt
            trap 'php artisan up' EXIT

            git fetch origin main
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build

            php artisan migrate --force
            php artisan db:seed --class=DefaultPatternSeeder --force
            php artisan db:seed --class=ServerGrunddatenSeeder --force
            php artisan optimize
            php artisan queue:restart

            chown -R www-data:www-data storage bootstrap/cache database
            chmod -R 775 storage bootstrap/cache database

            APP_DIR="$(pwd)"
            PHP_BIN="$(command -v php)"

            # Queue-Worker als dauerhafter Dienst (startet auch nach einem Server-Neustart)
            cat > /etc/systemd/system/mixmatch-queue.service <<EOF
            [Unit]
            Description=mixmatch Laravel Queue Worker
            After=network.target

            [Service]
            User=www-data
            Group=www-data
            Restart=always
            RestartSec=5
            WorkingDirectory=$APP_DIR
            ExecStart=$PHP_BIN $APP_DIR/artisan queue:work --sleep=3 --tries=3 --max-time=3600

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable --now mixmatch-queue
            systemctl restart mixmatch-queue

            # Scheduler für geplante Jobs (z. B. stündliche Terminerinnerungen)
            echo "* * * * * www-data cd $APP_DIR && $PHP_BIN artisan schedule:run >> /dev/null 2>&1" > /etc/cron.d/mixmatch-scheduler
            chmod 644 /etc/cron.d/mixmatch-scheduler

            # Prüfen, ob der Queue-Worker läuft (Ergebnis steht im Actions-Log)
            echo "=========== QUEUE-WORKER-CHECK ==========="
            systemctl is-active mixmatch-queue || echo "ACHTUNG: Der Queue-Worker läuft NICHT!"
            echo "Wartende Aufträge: $(php artisan tinker --execute 'echo DB::table("jobs")->count();' 2>/dev/null || echo unbekannt)"
            echo "=========================================="